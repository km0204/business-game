<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>企業投資ビジネスゲーム</title>
  <style>
    :root {
      --gap: 12px;
      --bg: #eef2ff;
      --card: rgba(255,255,255,0.9);
      --card-border: #dbeafe;
      --text: #0f172a;
      --subtle: #64748b;
      --primary: #2563eb;
      --primary-2: #1d4ed8;
      --accent: #7c3aed;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      margin: 0;
      background: radial-gradient(circle at top, #dbeafe 0%, var(--bg) 42%, #f8fafc 100%);
      color: var(--text);
    }
    header {
      padding: 14px 16px;
      background: linear-gradient(120deg, #111827, #1e3a8a 55%, #4c1d95 100%);
      color: #fff;
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid rgba(255,255,255,.12);
    }
    header h1 { font-size: 16px; margin: 0; letter-spacing: .02em; }
    main { padding: 16px 16px 90px; max-width: 880px; margin: 0 auto; }
    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 10px 30px rgba(30, 64, 175, .10);
      backdrop-filter: blur(6px);
      margin-bottom: 12px;
    }
    .grid { display: grid; gap: var(--gap); }
    .grid-2 { grid-template-columns: 1fr 1fr; }
    @media (max-width: 560px) { .grid-2 { grid-template-columns: 1fr; } }
    .row { display:flex; gap: var(--gap); align-items: center; flex-wrap: wrap; }
    label { font-size: 12px; color:#334155; display:block; margin-bottom: 6px; font-weight: 600; }
    input[type="number"], input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      font-size: 16px;
      background:#fff;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 4px rgba(59,130,246,.18);
    }
    .hint { font-size: 12px; color: var(--subtle); margin-top: 6px; }
    .pill {
      display:inline-flex;
      align-items:center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      background: linear-gradient(120deg, #eef2ff, #ede9fe);
      color:#312e81;
      border: 1px solid #c7d2fe;
      font-size: 12px;
      font-weight: 600;
    }
    .kpi { display:flex; gap: 10px; flex-wrap: wrap; }
    .kpi .box {
      flex: 1;
      min-width: 180px;
      background: linear-gradient(140deg, #ffffff, #eff6ff);
      border:1px solid #bfdbfe;
      border-radius: 14px;
      padding: 12px;
    }
    .kpi .box .t { font-size: 12px; color:#475569; }
    .kpi .box .v { font-size: 20px; font-weight: 800; margin-top: 6px; color:#1e3a8a; }
    button {
      padding: 12px 14px;
      border: 0;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color:#fff;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(37,99,235,.25);
      transition: transform .12s ease, filter .12s ease;
    }
    button:hover { transform: translateY(-1px); filter: brightness(1.02); }
    button.secondary { background: linear-gradient(135deg, #334155, #0f172a); box-shadow: 0 8px 20px rgba(15,23,42,.25); }
    button.ghost { background: #e2e8f0; color:#0f172a; box-shadow: none; }
    button:disabled { opacity: .55; cursor: not-allowed; transform: none; }
    table { width: 100%; border-collapse: collapse; border-radius: 10px; overflow: hidden; }
    th, td { padding: 10px 8px; border-bottom: 1px solid #e2e8f0; text-align: right; }
    th { text-align: right; font-size: 12px; color:#64748b; background: #f8fafc; }
    th:first-child, td:first-child { text-align: left; }
    tfoot th { background: #eff6ff; color: #1d4ed8; font-weight: 700; }
    .ok { color:#065f46; font-weight: 700; }
    .ng { color:#991b1b; font-weight: 700; }
    .log {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      white-space: pre-wrap;
      background: linear-gradient(140deg, #0b1020, #111827);
      color:#e5e7eb;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 12px;
    }
    .small { font-size: 12px; color: var(--subtle); }
  </style>
</head>
<body>
<header>
  <h1>企業投資ビジネスゲーム（ローカル / オフライン）</h1>
</header>

<main>
  <div class="card">
    <div class="kpi">
      <div class="box">
        <div class="t">初期資金</div>
        <div class="v" id="kpiInitial">¥1,000,000</div>
      </div>
      <div class="box">
        <div class="t">現在の総資産（投資＋未投資）</div>
        <div class="v" id="kpiTotal">¥0</div>
      </div>
      <div class="box">
        <div class="t">イベント回数</div>
        <div class="v" id="kpiRound">0</div>
      </div>
      <div class="box">
        <div class="t">未投資残高（入力中）</div>
        <div class="v" id="kpiRemaining">¥1,000,000</div>
      </div>
    </div>
    <div class="hint">※ 投資額を入力すると、未投資残高が自動更新されます。</div>
  </div>

  <div class="card">
    <div class="row" style="justify-content: space-between;">
      <div class="row">
        <span class="pill">① 投資額を入力 → ② 投資を確定 → ③ イベント番号 → ④ イベント適用</span>
      </div>
      <div class="row">
        <span class="small">通貨: 円 / 端数: 四捨五入</span>
      </div>
    </div>
  </div>

  <div class="card">
    <h2 style="margin:0 0 10px; font-size: 15px;">1) 投資額入力（8企業）</h2>
    <div class="grid grid-2" id="companyInputs"></div>
    <div class="hint" id="minHint"></div>
    <div class="row" style="margin-top: 12px;">
      <button id="btnConfirm">投資を確定</button>
    </div>
  </div>

  <div class="card">
    <h2 style="margin:0 0 10px; font-size: 15px;">現在の投資状況</h2>
    <div style="overflow:auto;">
      <table>
        <thead>
          <tr>
            <th>企業</th>
            <th>最低投資額</th>
            <th>現在の投資額</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
        <tfoot>
          <tr>
            <th>合計</th>
            <th></th>
            <th id="tableTotal">¥0</th>
          </tr>
        </tfoot>
      </table>
    </div>
  </div>

  <div class="card">
    <h2 style="margin:0 0 10px; font-size: 15px;">履歴ログ</h2>
    <div class="log" id="log"></div>
  </div>

  <div class="card">
    <h2 style="margin:0 0 10px; font-size: 15px;">2) イベント適用</h2>
    <div>
      <label for="eventNo">イベント番号（1〜7）</label>
      <input id="eventNo" type="number" min="1" max="7" inputmode="numeric" placeholder="例: 3" />
      <div class="hint">司会から指定された番号を入力してください。</div>
    </div>

    <div class="row" style="margin-top: 12px;">
      <button id="btnApply" disabled>イベント適用</button>
      <button class="ghost" id="btnNewRound">新しいラウンド（投資額を再入力）</button>
      <button class="secondary" id="btnReset">全リセット</button>
    </div>
    <div class="hint">※「投資を確定」していない状態ではイベント適用できません。</div>
  </div>

</main>

<script>
(() => {
  // ====== 設定 ======
  const INITIAL_CASH = 1_000_000; // 初期資金（今回は100万円固定）
  const companies = [
    {
      id: "A",
      name: "ワンライフ不動産",
      industry: "不動産",
      capital: 5_000_000,
      min: 300_000,
      risk: "安定型",
      description: "学生マンション賃貸",
    },
    {
      id: "B",
      name: "立正銀行",
      industry: "銀行",
      capital: 5_000_000,
      min: 300_000,
      risk: "安定型",
      description: "投資信託、預金貸出業務",
    },
    {
      id: "C",
      name: "チャットスタイル",
      industry: "IT",
      capital: 5_000_000,
      min: 200_000,
      risk: "成長型",
      description: "アパレル企業と提携してお勧めのコーデやアイテムをピックアップ",
    },
    {
      id: "D",
      name: "ネクストライフ保険",
      industry: "保険",
      capital: 3_000_000,
      min: 200_000,
      risk: "安定型",
      description: "ファミリアー新プラン、短期トラベルプラン",
    },
    {
      id: "E",
      name: "ほしぞランド",
      industry: "スーパー",
      capital: 2_000_000,
      min: 100_000,
      risk: "安定型",
      description: "毎月セール",
    },
    {
      id: "F",
      name: "未来航路トラベル",
      industry: "旅行会社",
      capital: 3_000_000,
      min: 200_000,
      risk: "ハイリスク型",
      description: "海外国内旅行のオーダーメイドの企画販売",
    },
    {
      id: "G",
      name: "スターコーヒー",
      industry: "飲食店",
      capital: 5_000_000,
      min: 100_000,
      risk: "成長型",
      description: "自家焙煎コーヒー豆を使用したドリンクの提供",
    },
    {
      id: "H",
      name: "Goggles",
      industry: "外資系",
      capital: 5_000_000,
      min: 300_000,
      risk: "成長型",
      description: "検索エンジン、マップ、メールなど様々な企業の提供",
    },
  ];

  // イベント7パターン（各企業ごとの増減率）
  // 例: +0.10 は +10%、-0.20 は -20%
  const events = [
    { no: 1, title: "大恐慌", rates: {A:-0.30, B:-0.20, C:-0.10, D:-0.10, E:0.10, F:-0.30, G:-0.20, H:-0.20} },
    { no: 2, title: "感染症", rates: {A:-0.10, B:-0.10, C:0.20, D:0.10, E:0.20, F:-0.30, G:-0.30, H:-0.10} },
    { no: 3, title: "オリンピック開催", rates: {A:0.20, B:0.10, C:0.10, D:0.10, E:0.10, F:0.30, G:0.30, H:0.20} },
    { no: 4, title: "ITバブル", rates: {A:-0.10, B:-0.10, C:0.30, D:-0.10, E:0.00, F:-0.10, G:-0.10, H:0.20} },
    { no: 5, title: "人口減少", rates: {A:-0.20, B:-0.20, C:0.10, D:0.20, E:-0.10, F:-0.20, G:-0.20, H:0.10} },
    { no: 6, title: "円安", rates: {A:0.10, B:0.10, C:0.20, D:0.00, E:-0.10, F:0.30, G:0.10, H:0.30} },
    { no: 7, title: "政策があたる", rates: {A:0.20, B:0.20, C:0.20, D:0.10, E:0.10, F:0.10, G:0.10, H:0.10} },
  ];

  // ====== 状態 ======
  let confirmed = false;
  let round = 0;
  const state = {
    initial: INITIAL_CASH,
    investments: Object.fromEntries(companies.map(c => [c.id, 0])),
    uninvested: INITIAL_CASH,
  };

  // ====== DOM ======
  const elCompanyInputs = document.getElementById("companyInputs");
  const elMinHint = document.getElementById("minHint");
  const elTableBody = document.getElementById("tableBody");
  const elTableTotal = document.getElementById("tableTotal");
  const elLog = document.getElementById("log");

  const elKpiInitial = document.getElementById("kpiInitial");
  const elKpiTotal = document.getElementById("kpiTotal");
  const elKpiRound = document.getElementById("kpiRound");
  const elKpiRemaining = document.getElementById("kpiRemaining");

  const btnConfirm = document.getElementById("btnConfirm");
  const btnApply = document.getElementById("btnApply");
  const btnReset = document.getElementById("btnReset");
  const btnNewRound = document.getElementById("btnNewRound");
  const inputEventNo = document.getElementById("eventNo");

  // ====== ユーティリティ ======
  const yen = (n) => "¥" + Math.round(n).toLocaleString("ja-JP");
  const numberWithCommas = (n) => Math.round(n).toLocaleString("ja-JP");

  function toHalfWidth(text) {
    return text.replace(/[０-９．，]/g, (ch) => {
      if (ch === "．") return ".";
      if (ch === "，") return ",";
      return String.fromCharCode(ch.charCodeAt(0) - 0xFEE0);
    });
  }

  function parseAmount(text) {
    const raw = toHalfWidth(String(text || "")).trim();
    if (!raw) return { value: 0, empty: true, valid: true };

    // 入力しやすさ優先: 通貨記号・カンマ・空白は無視する
    const cleaned = raw.replace(/\s+/g, "").replace(/[円,¥￥]/g, "");
    const matched = cleaned.match(/^([0-9]+(?:\.[0-9]+)?)$/);
    if (!matched) return { valid: false };

    const base = Number(matched[1]);
    if (!Number.isFinite(base) || base < 0) return { valid: false };

    return { value: Math.round(base), empty: false, valid: true };
  }

  function formatAmountInput(el) {
    const parsed = parseAmount(el.value);
    if (!parsed.valid || parsed.empty) return;
    el.value = numberWithCommas(parsed.value);
  }

  function getInputTotal() {
    return companies.reduce((acc, c) => {
      const el = document.getElementById(`inv_${c.id}`);
      if (!el) return acc;
      const parsed = parseAmount(el.value);
      if (!parsed.valid || parsed.empty) return acc;
      return acc + parsed.value;
    }, 0);
  }

  function sumInvestments() {
    return companies.reduce((acc, c) => acc + (state.investments[c.id] || 0), 0);
  }

  function getCurrentBudget() {
    return sumInvestments() + state.uninvested;
  }

  function renderRemainingPreview() {
    const remaining = confirmed ? state.uninvested : (getCurrentBudget() - getInputTotal());
    // 入力中の見た目ではマイナスを出さず、超過時は 0 円表示にする
    elKpiRemaining.textContent = yen(Math.max(0, remaining));
  }

  function setLog(text, append=true) {
    if (append) elLog.textContent = (elLog.textContent ? (elLog.textContent + "\n") : "") + text;
    else elLog.textContent = text;
  }

  function renderInputs() {
    elCompanyInputs.innerHTML = "";
    companies.forEach(c => {
      const wrap = document.createElement("div");
      wrap.innerHTML = `
        <label>${c.name}（${c.industry}）</label>
        <div class="small">資本金: ${yen(c.capital)} / 最低投資金額: ${yen(c.min)} / リスク: ${c.risk}</div>
        <div class="small">${c.description}</div>
        <input type="text" inputmode="numeric"
               id="inv_${c.id}" placeholder="例: 300000 / 300,000 / 300000円" />
        <div class="hint">0 でもOK（投資しない）。数字のみ入力してください（カンマ・円記号は可）。</div>
      `;
      elCompanyInputs.appendChild(wrap);

      const input = wrap.querySelector(`#inv_${c.id}`);
      input.addEventListener("input", renderRemainingPreview);
      input.addEventListener("blur", () => {
        formatAmountInput(input);
        renderRemainingPreview();
      });
    });

    elMinHint.textContent = "最低投資額は入力チェックに使います（0は未投資扱い）。";
  }

  function renderTable() {
    elTableBody.innerHTML = "";
    companies.forEach(c => {
      const tr = document.createElement("tr");
      const v = state.investments[c.id] || 0;
      tr.innerHTML = `
        <td>${c.name}</td>
        <td>${yen(c.min)}</td>
        <td>${yen(v)}</td>
      `;
      elTableBody.appendChild(tr);
    });

    const total = sumInvestments();
    const totalAssets = total + state.uninvested;
    elTableTotal.textContent = yen(total);
    elKpiInitial.textContent = yen(state.initial);
    elKpiTotal.textContent = yen(totalAssets);
    elKpiRound.textContent = String(round);
    renderRemainingPreview();

    btnApply.disabled = !confirmed;
    btnConfirm.textContent = confirmed ? "投資を確定（確定済み）" : "投資を確定";
    btnConfirm.disabled = confirmed;
  }

  function validateAndConfirm() {
    const inputs = companies.map(c => {
      const el = document.getElementById(`inv_${c.id}`);
      const parsed = parseAmount(el.value);
      return { c, el, parsed, val: parsed.value || 0 };
    });

    const invalid = inputs.filter(x => !x.parsed.valid);
    if (invalid.length) {
      alert("入力形式が正しくない企業があります。\n例: 300000 / 300,000 / 300000円");
      invalid[0].el.focus();
      return;
    }

    // 最低投資額チェック（0は未投資として許可）
    const badMin = inputs.filter(x => x.val > 0 && x.val < x.c.min);
    if (badMin.length) {
      alert("最低投資額未満の企業があります:\n" + badMin.map(x => `${x.c.name}: ${yen(x.val)}（最低 ${yen(x.c.min)}）`).join("\n"));
      return;
    }

    // 現在の利用可能資金を超えない
    const budget = getCurrentBudget();
    const total = inputs.reduce((a, x) => a + x.val, 0);
    if (total > budget) {
      alert(`投資合計が利用可能資金を超えています。\n投資合計: ${yen(total)} / 利用可能資金: ${yen(budget)}`);
      return;
    }

    // 確定
    inputs.forEach(x => {
      const fixed = Math.round(x.val);
      state.investments[x.c.id] = fixed;
      x.el.value = numberWithCommas(fixed);
    });
    confirmed = true;
    state.uninvested = budget - total;
    setLog(`✅ 投資確定: 合計 ${yen(sumInvestments())}（未投資残: ${yen(state.uninvested)}）`);
    renderTable();
  }

  function getEvent(no) {
    return events.find(e => e.no === no) || null;
  }

  function applyEvent(no) {
    if (!confirmed) return;

    const e = getEvent(no);
    if (!e) {
      alert("イベント番号は 1〜7 を入力してください。");
      return;
    }

    // 適用
    companies.forEach(c => {
      const r = e.rates[c.id] ?? 0;
      const before = state.investments[c.id] || 0;
      const after = Math.round(before * (1 + r));
      state.investments[c.id] = after;
    });

    round += 1;

    const total = sumInvestments() + state.uninvested;
    const line = `🎲 イベント適用 #${round}: イベント${e.no}を適用\n   → 総資産: ${yen(total)}`;
    setLog(line);

    renderTable();
  }

  function newRound() {
    confirmed = false;
    // 入力欄を現在値で埋める（次の投資配分を考えやすい）
    companies.forEach(c => {
      const el = document.getElementById(`inv_${c.id}`);
      if (el) el.value = numberWithCommas(state.investments[c.id] || 0);
    });
    setLog("📝 新しいラウンド: 投資額を再入力してください（投資確定すると適用されます）。");
    renderTable();
  }

  function resetAll() {
    if (!confirm("全リセットします。よろしいですか？")) return;
    round = 0;
    confirmed = false;
    companies.forEach(c => state.investments[c.id] = 0);
    state.uninvested = state.initial;
    companies.forEach(c => {
      const el = document.getElementById(`inv_${c.id}`);
      if (el) el.value = "";
    });
    setLog("🔄 リセットしました。投資額を入力してください。", false);
    renderTable();
  }

  // ====== イベント ======
  btnConfirm.addEventListener("click", validateAndConfirm);
  btnApply.addEventListener("click", () => applyEvent(Number(inputEventNo.value)));
  btnReset.addEventListener("click", resetAll);
  btnNewRound.addEventListener("click", newRound);

  // ====== 初期化 ======
  renderInputs();
  setLog("📌 準備OK：投資額を入力して「投資を確定」→ イベント番号を入力して「イベント適用」", false);
  renderTable();

})();
</script>
</body>
</html>
